spring:
  # Tomcat文件上传大小限制（核心）
  tomcat:
    max-swallow-size: 50MB  # 允许Tomcat接收的最大请求体大小
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      enabled: true  # 开启文件上传
      max-request-size: 1024MB  # 整个请求体的最大大小（多文件总和，需大于max-file-size）
      file-size-threshold: 1MB  # 文件大小超过此值时，写入临时文件（可选）
  application:
    name: fruit
  datasource:
    druid:
      driver-class-name: com.mysql.jdbc.Driver
      url: jdbc:mysql://192.168.123.92:3306/fruit?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: tyzx99ty!
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss.SSS
    time-zone: GMT+8
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
#   RabbitMQ 核心配置
  rabbitmq:
    host: 192.168.123.92  # RabbitMQ 服务器地址（默认localhost）
    port: 5672       # 默认端口
    username: guest  # 默认用户名（本地开发用guest即可）
    password: guest  # 默认密码
    virtual-host: /  # 虚拟主机（默认/）
    # 可选：连接池配置（提升性能）
    connection-timeout: 15000  # 连接超时时间
    cache:
      channel:
        size: 50  # 通道缓存大小
      connection:
        size: 10  # 连接池大小
        mode: CONNECTION
    publisher-confirm-type: correlated  # 开启生产者确认（correlated：异步回调）
    publisher-returns: true             # 开启消息返回（路由失败时回调）
  # Redis 配置
  redis:
    host: 192.168.123.92
    port: 6379
    password:  # 本地Redis默认无密码
    database: 0
    timeout: 10000

